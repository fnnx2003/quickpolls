name: quickpolls-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: fnnnx/quickpolls-${{ matrix.service }}:${{github.sha }}
  update-manifests:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update image tags
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' api-chart/values.yaml
          yq -i '.image.tag = "${{ github.sha }}"' web-chart/values.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add api-chart web-chart
          git commit -m "Deploy ${{ github.sha }} [skip ci]" || exit 0
          git pull --rebase
          git push
