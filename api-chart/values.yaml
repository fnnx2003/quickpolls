replicaCount: 2
image:
  repository: fnnnx/quickpolls-api
  tag: "a451b63f6c2bf252d6b248778beabd57f6f698e0"
  pullPolicy: IfNotPresent
containerPort: 3000
service:
  type: ClusterIP
  port: 80
env:
  PGHOST: quickpolls-db
  PGPORT: "5432"
  PGUSER: quickpolls
  PGDATABASE: quickpolls
  REDIS_URL: redis://quickpolls-redis:6379
dbSecret:
  name: db-secret
  key: password
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probe:
  readiness: /readyz
  liveness: /healthz
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 60
