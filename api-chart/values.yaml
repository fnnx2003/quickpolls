replicaCount: 2

image:
  repository: fnnnx/quickpolls-api
  tag: "1.0"
  pullPolicy: IfNotPresent

containerPort: 3000

service:
  type: ClusterIP
  port: 80

env:
  PGHOST: quickpolls-db
  PGPORT: "5432"
  PGUSER: quickpolls
  PGDATABASE: quickpolls

dbSecret:
  name: db-secret
  key: password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probe:
  readiness: /readyz
  liveness: /healthz



