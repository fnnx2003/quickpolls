image:
  repository: postgres
  tag: "16"
  PullPolicy: IfNotPresent

containerPort: 5432

postgres:
  user: quickpolls
  database: quickpolls

dbSecret:
  name: db-secret
  key: password

storage:
  size: 1Gi

service:
  port: 5432

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
